[project]
name = "wifi-connector"
version = "0.1.0"
description = "macOS app that joins a Wi-Fi network you select with a password you provide"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-CoreLocation>=10.3",
    "pyobjc-framework-CoreWLAN>=10.3",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel.force-include]
"common_passwords.yaml" = "wifi_connector/common_passwords.yaml"

[project.scripts]
wifi-connect = "wifi_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
